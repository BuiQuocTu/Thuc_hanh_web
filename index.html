<!DOCTYPE html>
<html lang="vi">
<head>

    <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="font-body text-ink bg-surface">

    <header>

    </header>

    <main>
        <section>

        </section><!-- Khối tính năng -->

                    </div>
                    <div class="p-6 bg-white rounded-lg shadow">
                        <h3 class="text-xl font-semibold mb-2">Bảo mật tuyệt đối</h3>
